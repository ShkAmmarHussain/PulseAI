<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Jarvis Pet</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    html, body {
      background: transparent !important;
      overflow: hidden !important;
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      user-select: none;
    }
  </style>
</head>
<body class="pet-transparent-surface">
  <div id="pet-container" data-tauri-drag-region>

    <!-- Floating speech bubble: strictly ABOVE the head with clearance -->
    <div id="pet-bubble-anchor">
      <div id="bubble" class="floating-bubble" role="status" aria-live="polite">
        <div class="bubble-content" id="bubble-text"></div>
        <span class="bubble-tail" aria-hidden="true"></span>
      </div>
    </div>

    <!-- Human-in-the-loop approval card: strictly ABOVE the head -->
    <div id="approval-anchor">
      <div id="approval" class="floating-approval-card" role="alertdialog">
        <div class="approval-header">
          <span class="approval-badge"><svg class="ic"><use href="#i-shield"/></svg>Safety Confirmation</span>
          <span class="approval-timer" id="approval-countdown">30s</span>
        </div>
        <div class="approval-body" id="approval-msg"></div>
        <div class="approval-actions">
          <button class="btn-allow" id="pet-allow-btn">Allow once</button>
          <button class="btn-deny" id="pet-deny-btn">Deny</button>
        </div>
      </div>
    </div>

    <!-- Dual-render character stage: 2D vector Mochi + 3D WebGL Mochi (doc 31, section 2.2) -->
    <div id="pet-stage">
      <!-- 1. 2D Animated Vector Mochi (default / toggleable) -->
      <div id="pet-2d" class="pet-render-layer" role="img" aria-label="Jarvis 2D Pet">
        <svg class="pet-svg-character" viewBox="0 0 128 128">
          <defs>
            <linearGradient id="p2d-body" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#fffdf8"/>
              <stop offset="100%" stop-color="#f6e7d2"/>
            </linearGradient>
          </defs>
          <!-- Ears -->
          <g class="p2d-ears">
            <ellipse class="p2d-ear-l" cx="42" cy="30" rx="14" ry="17" fill="url(#p2d-body)" transform="rotate(-14 42 30)"/>
            <ellipse class="p2d-ear-r" cx="86" cy="30" rx="14" ry="17" fill="url(#p2d-body)" transform="rotate(14 86 30)"/>
            <ellipse class="p2d-inner-l" cx="43" cy="31" rx="6.5" ry="9" fill="#fb923c" opacity="0.85" transform="rotate(-14 43 31)"/>
            <ellipse class="p2d-inner-r" cx="85" cy="31" rx="6.5" ry="9" fill="#fb923c" opacity="0.85" transform="rotate(14 85 31)"/>
          </g>
          <!-- Chubby body squircle -->
          <rect class="p2d-body-shape" x="17" y="34" width="94" height="82" rx="36" fill="url(#p2d-body)"/>
          <!-- Rosy blush cheeks -->
          <g class="p2d-cheeks">
            <ellipse class="p2d-blush-l" cx="34" cy="86" rx="8.5" ry="5" fill="#ff9e9e" opacity="0.75"/>
            <ellipse class="p2d-blush-r" cx="94" cy="86" rx="8.5" ry="5" fill="#ff9e9e" opacity="0.75"/>
          </g>
          <!-- Eyes with dual glints (saccade group) -->
          <g class="p2d-eyes">
            <g class="p2d-lids">
              <ellipse class="p2d-eye-l" cx="47" cy="70" rx="7" ry="9" fill="#35292a"/>
              <ellipse class="p2d-eye-r" cx="81" cy="70" rx="7" ry="9" fill="#35292a"/>
              <circle class="p2d-glint-pri-l" cx="49.5" cy="66.5" r="2.6" fill="#fff"/>
              <circle class="p2d-glint-pri-r" cx="83.5" cy="66.5" r="2.6" fill="#fff"/>
              <circle class="p2d-glint-sec-l" cx="44.5" cy="74" r="1.4" fill="#fff" opacity="0.85"/>
              <circle class="p2d-glint-sec-r" cx="78.5" cy="74" r="1.4" fill="#fff" opacity="0.85"/>
            </g>
          </g>
          <!-- Sleepy arcs (shown in sleeping mood) -->
          <g class="p2d-sleep-group" aria-hidden="true">
            <path class="p2d-sleep" d="M40 70 Q47 76 54 70"/>
            <path class="p2d-sleep" d="M74 70 Q81 76 88 70"/>
          </g>
          <!-- Cheerful smile arc -->
          <path class="p2d-mouth" d="M57 92 Q64 99.5 71 92" stroke="#35292a" stroke-width="3.2" stroke-linecap="round" fill="none"/>
        </svg>
      </div>

      <!-- 2. 3D WebGL stage (Three.js) -->
      <div id="pet-3d" class="pet-render-layer" style="display: none;">
        <div id="pet" data-mood="idle"></div>
      </div>

      <!-- Warm ambient floor halo -->
      <div class="pet-floor-glow" aria-hidden="true"></div>
    </div>

    <!-- Contextual floating micro-dock: AUTO-HIDING, appears only on hover -->
    <div id="pet-hover-dock" class="context-dock" aria-label="Quick Actions">
      <button class="dock-action-btn" id="dock-btn-mic" title="Talk to Jarvis (Push-to-Talk)" aria-label="Talk to Jarvis">
        <svg class="ic"><use href="#i-mic"/></svg>
      </button>
      <button class="dock-action-btn" id="dock-btn-chat" title="Open Command Center" aria-label="Open chat">
        <svg class="ic"><use href="#i-chat"/></svg>
      </button>
      <button class="dock-action-btn" id="dock-btn-dockmode" title="Switch to Top-Edge Dynamic Island" aria-label="Switch to top-edge dock">
        <svg class="ic"><use href="#i-dock"/></svg>
      </button>
      <button class="dock-action-btn" id="dock-btn-rendermode" title="Switch 2D / 3D Mode" aria-label="Toggle 2D or 3D pet">
        <span id="dock-render-label">2D</span>
      </button>
      <button class="dock-action-btn" id="dock-btn-settings" title="Settings" aria-label="Open settings">
        <svg class="ic"><use href="#i-sliders"/></svg>
      </button>
    </div>

  </div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12c0 4-4 7-9 7-1.2 0-2.3-.2-3.3-.5L4 20l1.2-3.3C4.4 15.4 4 13.7 4 12c0-4 4-7 9-7s8 3 8 7z"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
      <symbol id="i-dock" viewBox="0 0 24 24"><path d="M4 4h16M4 20h16M12 9l-4 4h8l-4-4z"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 7.8-7 10-4-2.2-7-5.5-7-10V6l7-3z"/></symbol>
    </defs>
  </svg>

  <script src="ws.js"></script>
  <script src="pet.js"></script>
  <script src="pet2d.js"></script>
  <script type="module" src="pet3d.js"></script>
</body>
</html>
