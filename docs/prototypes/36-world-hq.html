<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body><title>PulseAI HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Operate surface inside the doc 34 world: black chrome, card-on-black depth, one hairline, amber signature, state glows */
:root{
  --bg:#000; --card:#141518; --card-flat:#0e0f11; --tab-on:#1d1f23; --raise:#18191d;
  --hairline:rgba(255,255,255,.06); --hair-strong:rgba(255,255,255,.1);
  --ink:#f5f6f8; --dim:#a2a7b0; --dim-3:#868b94;
  --accent:#f5a524; --accent-hover:#f7b84a; --accent-ink:#1a1204; --accent-soft:rgba(245,165,36,.14);
  --success:#4ade80; --danger:#f4505e; --info:#a5b4fc;
  --glow-approval:rgba(245,165,36,.26);
  --font-ui:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
  --r-card:22px; --r-row:12px; --r-ctl:10px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink)}
body{font-family:var(--font-ui);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
::selection{background:rgba(245,165,36,.35);color:#fff}
*{scrollbar-width:thin;scrollbar-color:#2a2c31 transparent}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

.app{color:var(--ink);background:var(--bg);height:100%;min-height:620px;display:grid;grid-template-columns:268px minmax(0,1fr) 332px;grid-template-rows:52px minmax(0,1fr)}
.bar{grid-column:1/-1;display:flex;align-items:center;gap:20px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--hairline);background:#060607}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:14px;letter-spacing:-.005em}
.brand-mark{width:18px;height:22px;border-radius:50% 50% 46% 46%/58% 58% 42% 42%;background:radial-gradient(circle at 40% 35%,#ffd58a,#f5a524 55%,#c97a06);box-shadow:0 2px 8px rgba(245,165,36,.35)}
.tabs{display:flex;gap:2px}
.tab{background:none;border:0;padding:7px 12px;border-radius:8px;color:var(--dim);cursor:pointer;transition:background .18s,color .18s}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.tab[aria-selected="true"]{background:var(--tab-on);color:var(--ink)}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.proto{font-size:11.5px;color:var(--dim-3);padding:0 4px}
.seg{display:flex;padding:3px;gap:2px;background:var(--card-flat);border:1px solid var(--hairline);border-radius:var(--r-ctl)}
.seg button{background:none;border:0;min-width:34px;height:28px;padding:0 10px;border-radius:7px;color:var(--dim);cursor:pointer;font-variant-numeric:tabular-nums;transition:background .18s,color .18s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--tab-on);color:var(--ink)}
.seg-label{font-size:12px;color:var(--dim-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--hair-strong);background:var(--card);color:var(--ink);cursor:pointer;font-weight:550;white-space:nowrap;transition:background .18s,border-color .18s,transform .12s}
.btn:hover{background:var(--tab-on)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:650}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:rgba(244,80,94,.12);border-color:rgba(244,80,94,.4);color:#ff8f9a}
.btn.danger:hover{background:rgba(244,80,94,.2)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.btn.sm{height:30px;padding:0 11px;font-size:12.5px}
.icon-btn{width:34px;padding:0}

/* roster */
.roster{border-right:1px solid var(--hairline);background:#050506;display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;padding:18px 18px 10px}
.panel-head h2{margin:0;font-size:15px;font-weight:650}
.count{font-size:12px;color:var(--dim-3);font-variant-numeric:tabular-nums}
.roster-scroll{flex:1;overflow:auto;padding:0 10px 12px;display:flex;flex-direction:column;gap:2px}
.group-h{font-size:12px;color:var(--dim-3);padding:14px 8px 6px}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-row);border:0;background:none;text-align:left;cursor:pointer;width:100%;transition:background .18s}
.row:hover{background:rgba(255,255,255,.04)}
.row[aria-current="true"]{background:var(--card)}
.avatar{width:36px;height:36px;border-radius:11px;background:var(--card-flat);overflow:hidden;display:grid;place-items:center}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.row-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--dim-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:#33363c}
.dot.work{background:var(--accent);box-shadow:0 0 0 3px rgba(245,165,36,.16)}
.dot.approval{background:var(--accent);animation:pulse 1.4s ease-out infinite}
.dot.think{background:var(--info)}
.dot.done{background:var(--success)}
.dot.fail{background:var(--danger)}
.dot.walk{background:#e5e7eb}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,165,36,.55)}100%{box-shadow:0 0 0 9px rgba(245,165,36,0)}}
.roster-foot{padding:12px 14px 16px;border-top:1px solid var(--hairline);display:flex;flex-direction:column;gap:10px}
.roster-foot .btns{display:flex;gap:8px}
.roster-foot .btns .btn{flex:1}
.newform{display:flex;flex-direction:column;gap:10px;background:var(--card);border-radius:16px;padding:14px}
.newform label{font-size:12.5px;color:var(--dim)}
.field{height:36px;border-radius:var(--r-ctl);border:1px solid var(--hair-strong);background:var(--card-flat);padding:0 12px;outline:none;transition:border-color .18s}
.field:focus{border-color:rgba(245,165,36,.6)}
.field::placeholder{color:var(--dim-3)}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.preset{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--hair-strong);background:transparent;color:var(--dim);cursor:pointer;font-size:12px}
.preset:hover{color:var(--ink);border-color:rgba(255,255,255,.2)}
.newform .btns{display:flex;gap:8px;justify-content:flex-end}

/* stage */
.stage-wrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:#050506}
#stage{position:absolute;inset:0}
#stage canvas{display:block;outline:none}
.labels{position:absolute;inset:0;pointer-events:none}
.hint{position:absolute;left:18px;top:14px;font-size:12px;color:var(--dim-3);pointer-events:none}
.fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--dim)}
.tag{display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:auto;cursor:pointer;user-select:none}
.tag-name{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(9,9,11,.84);border:1px solid rgba(255,255,255,.08);color:var(--ink);white-space:nowrap;transition:background .18s,color .18s}
.tag.temp .tag-name{border:1px dashed rgba(245,165,36,.85)}
.tag.sel .tag-name{background:var(--ink);color:#0b0b0c;border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;height:21px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(20,21,24,.94);color:#cfd2d8;white-space:nowrap;border:1px solid rgba(255,255,255,.06)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.work{color:#f8c46e}
.chip.think{color:var(--info)}
.chip.think::after{content:"";width:14px;height:6px;background:radial-gradient(circle,currentColor 1.4px,transparent 1.8px) 0 50%/5px 6px repeat-x;animation:dots 1.2s steps(3) infinite}
@keyframes dots{from{width:4px}to{width:15px}}
.chip.approval{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chip.approval::before{background:var(--accent-ink)}
.chip.done{color:var(--success)}
.chip.fail{color:#ff8f9a}
.chip.wait{color:var(--dim)}
.chip.walk{color:#e5e7eb}
.chip[hidden]{display:none}
.room-label{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:rgba(245,246,248,.78);white-space:nowrap;pointer-events:none;text-shadow:0 1px 6px #000}
.room-label i{width:7px;height:7px;border-radius:2px;background:var(--c)}

.dock{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(780px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px}
.job{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 16px;background:rgba(14,15,17,.94);border:1px solid var(--hairline);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.job-title{display:flex;flex-direction:column;min-width:0;flex:0 1 210px}
.job-title strong{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job-title span{font-size:12px;color:var(--dim-3)}
.tasks{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto}
.task{display:flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:9px;background:var(--card);font-size:12px;color:var(--dim);white-space:nowrap}
.task b{font-weight:600;color:var(--ink)}
.task .dot{width:7px;height:7px}
.composer{display:flex;align-items:center;gap:8px;padding:8px;background:rgba(14,15,17,.96);border:1px solid var(--hairline);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.45)}
.composer .field{flex:1;min-width:0;height:40px;border:0;background:transparent;font-size:14px;padding:0 6px}
.mic{width:40px;height:40px;border-radius:12px;border:0;background:var(--tab-on);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.mic:hover{background:#26292e}

/* inspector */
.inspector{border-left:1px solid var(--hairline);background:#050506;display:flex;flex-direction:column;min-height:0}
.insp-scroll{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.who{display:grid;grid-template-columns:76px minmax(0,1fr);gap:14px;align-items:center}
.portrait{width:76px;height:76px;border-radius:20px;background:radial-gradient(circle at 50% 30%,#22242a,#101113);overflow:hidden}
.portrait img{width:100%;height:100%;display:block}
.who h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
.who p{margin:2px 0 0;font-size:12.5px;color:var(--dim)}
.badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.badge{height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:7px;background:var(--tab-on);font-size:11.5px;color:var(--dim);font-weight:600}
.badge.temp{color:var(--accent);background:var(--accent-soft)}
.badge.custom{color:var(--info);background:rgba(165,180,252,.12)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:12.5px;font-weight:600;color:var(--dim)}
.now{background:var(--card);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.now p{margin:0;font-size:14px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:12px;color:#c3c7ce}
.log li{display:grid;grid-template-columns:44px 1fr;gap:8px}
.log time{color:var(--dim-3);font-variant-numeric:tabular-nums}
.skills{display:flex;flex-wrap:wrap;gap:6px}
.skill{height:24px;display:inline-flex;align-items:center;padding:0 8px;border-radius:7px;background:var(--card-flat);border:1px solid var(--hairline);font-family:var(--font-mono);font-size:11.5px;color:#c3c7ce}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--dim-3)} .kv dd{margin:0;text-align:right}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.look-row{display:flex;gap:8px}
.approval-card{position:relative;margin:0 18px 18px;padding:16px;border-radius:var(--r-card);background:var(--card);overflow:hidden;display:flex;flex-direction:column;gap:12px}
.approval-card::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-60px;height:120px;background:radial-gradient(ellipse at 50% 0%,var(--glow-approval),transparent 70%);pointer-events:none}
.approval-card .approval-top{display:flex;gap:12px;align-items:center}
.approval-card .approval-top .avatar{width:40px;height:40px}
.approval-card h3{margin:0;font-size:14px;font-weight:650}
.approval-card p{margin:2px 0 0;font-size:12.5px;color:var(--dim)}
.path{font-family:var(--font-mono);font-size:12px;color:#d6d9de;background:var(--card-flat);border-radius:9px;padding:8px 10px;overflow-wrap:anywhere}
.approval-card .btns{display:flex;gap:8px;position:relative;z-index:1}
.approval-card .btns .btn{flex:1;height:38px}
kbd{font-family:var(--font-mono);font-size:11px;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.25);margin-left:4px}
.btn:not(.primary) kbd{background:rgba(255,255,255,.08);color:var(--dim)}

.toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-8px);opacity:0;background:var(--raise);border:1px solid var(--hair-strong);padding:9px 14px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1100px){.app{grid-template-columns:232px minmax(0,1fr) 300px}.proto{display:none}}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 64vh auto auto}
  .bar{flex-wrap:wrap;gap:10px;padding-block:10px}
  .tabs{order:3;width:100%;overflow-x:auto}
  .bar-right{flex-wrap:wrap;gap:8px}
  .seg-label{display:none}
  .stage-wrap{min-height:420px}
  .roster{border-right:0;border-top:1px solid var(--hairline);order:4}
  .inspector{border-left:0;border-top:1px solid var(--hairline);order:3}
  .roster-scroll{max-height:none}
  .job{flex-wrap:wrap}
  .job-title{flex-basis:100%}
  .dock{bottom:10px;width:calc(100% - 20px)}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>PulseAI</div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" aria-selected="true">World</button>
      <button class="tab" role="tab" aria-selected="false" data-soon>Activity</button>
      <button class="tab" role="tab" aria-selected="false" data-soon>Memory</button>
      <button class="tab" role="tab" aria-selected="false" data-soon>Settings</button>
    </nav>
    <div class="bar-right">
      <span class="proto">Prototype · demo data</span>
      <span class="seg-label" id="floorLabel">Floor</span>
      <div class="seg" role="group" aria-labelledby="floorLabel" id="floorSeg">
        <button aria-pressed="true" data-floor="0">All</button>
        <button aria-pressed="false" data-floor="3">3</button>
        <button aria-pressed="false" data-floor="2">2</button>
        <button aria-pressed="false" data-floor="1">1</button>
      </div>
      <button class="btn icon-btn" id="homeBtn" aria-label="Reset the view" title="Reset the view"><svg class="i" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></button>
      <button class="btn danger" id="stopAll"><svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>Stop all</button>
    </div>
  </header>

  <aside class="roster" aria-label="Agents">
    <div class="panel-head"><h2>Agents</h2><span class="count" id="count"></span></div>
    <div class="roster-scroll" id="roster"></div>
    <div class="roster-foot">
      <form class="newform" id="newForm" hidden>
        <label for="newRole">What should the new agent do?</label>
        <input class="field" id="newRole" placeholder="e.g. Translate replies to Spanish" autocomplete="off">
        <div class="presets" id="presets">
          <button type="button" class="preset">Coder</button><button type="button" class="preset">Translator</button><button type="button" class="preset">Analyst</button><button type="button" class="preset">Designer</button>
        </div>
        <div class="btns"><button type="button" class="btn ghost sm" id="newCancel">Cancel</button><button type="submit" class="btn primary sm">Create agent</button></div>
      </form>
      <div class="btns">
        <button class="btn primary" id="addAgent"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New agent</button>
        <button class="btn" id="skillsBtn"><svg class="i" viewBox="0 0 24 24"><path d="M14.5 4.5 19.5 9.5 9 20H4v-5z"/><path d="m12.5 6.5 5 5"/></svg>Skills</button>
      </div>
    </div>
  </aside>

  <main class="stage-wrap" aria-label="PulseAI HQ, 3D view">
    <div id="stage"></div>
    <div class="hint">Drag to orbit · scroll to zoom · click anyone</div>
    <div class="dock">
      <div class="job" aria-live="polite">
        <div class="job-title"><strong id="jobTitle">Compare two laptops and save it</strong><span id="jobMeta">4 tasks</span></div>
        <ol class="tasks" id="tasks"></ol>
        <button class="btn ghost sm" id="replay"><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v4.5h4.5"/></svg>Replay</button>
      </div>
      <form class="composer" id="composer">
        <button type="button" class="mic" aria-label="Talk to Pip"><svg class="i" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
        <label for="ask" style="position:absolute;left:-9999px">Ask Pip</label>
        <input class="field" id="ask" placeholder="Ask Pip anything" autocomplete="off">
        <button class="btn primary" type="submit"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>Send</button>
      </form>
    </div>
  </main>

  <aside class="inspector" aria-label="Selected agent">
    <div class="insp-scroll" id="insp"></div>
    <section class="approval-card" id="approval" hidden aria-live="assertive">
      <div class="approval-top"><span class="avatar" id="apAvatar"></span><div><h3 id="apTitle">Otto wants to save a file</h3><p id="apSub">Risk 3 of 10 · writes one new file</p></div></div>
      <div class="path" id="apPath">C:\Users\you\Documents\laptops.md</div>
      <div class="btns"><button class="btn" id="deny">Deny<kbd>N</kbd></button><button class="btn primary" id="allow">Allow<kbd>Y</kbd></button></div>
    </section>
  </aside>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (s) => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W = 4, D = 5, H = 3, CZ = 4.15;
const col = (c) => new THREE.Color(c);
const mix = (a, b, t) => col(a).lerp(col(b), t);

/* ---------- renderer ---------- */
const stage = $('#stage');
let renderer;
try {

} catch (e) {

const ROLE_ROOM = (a) => (roomById[a.roomId] ? roomById[a.roomId].name.replace(' · spare', '') : 'Lobby') + ' · F' + (roomById[a.roomId] ? roomById[a.roomId].f + 1 : 1);
function refreshAgent(a) {
  const chip = a.tagEl.querySelector('.chip'); const show = a.state !== 'idle' && a.label;
  chip.hidden = !show; chip.className = 'chip ' + a.state; chip.textContent = a.label;
  a.tagEl.querySelector('.tag-name').textContent = a.name;
  a.tagEl.classList.toggle('sel', a === selected);
  a.tagEl.classList.toggle('temp', a.kind === 'temp');
  const row = document.querySelector(`.row[data-id="${a.id}"]`);
  if (row) { row.querySelector('.dot').className = 'dot ' + (a.state === 'idle' ? '' : a.state); row.querySelector('.row-sub').textContent = (a.state !== 'idle' && a.label) ? cap(a.label) : `${a.role} · ${ROLE_ROOM(a)}`; }
  if (a === selected) renderInspector();
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function renderRoster() {
  const team = agents.filter(a => a.kind !== 'temp'), temp = agents.filter(a => a.kind === 'temp');
  const row = (a) => `<button class="row" data-id="${a.id}" aria-current="${a === selected}"><span class="avatar"><img alt="" src="${portrait(a)}"></span><span style="min-width:0;display:block"><span class="row-name" style="display:block">${a.name}</span><span class="row-sub" style="display:block"></span></span><span class="dot"></span></button>`;
  $('#roster').innerHTML = `<div class="group-h">Team</div>${team.map(row).join('')}` + (temp.length ? `<div class="group-h">Temporary</div>${temp.map(row).join('')}` : '');
  $('#count').textContent = agents.length;
  document.querySelectorAll('.row').forEach(el => el.addEventListener('click', () => select(agents.find(a => a.id === el.dataset.id), true)));
  agents.forEach(refreshAgent);
}
function renderInspector() {
  const a = selected; if (!a) return;
  const kind = a.kind === 'temp' ? '<span class="badge temp">Temporary</span>' : a.kind === 'custom' ? '<span class="badge custom">Custom</span>' : '<span class="badge">Default</span>';
  const stateText = { idle: 'Idle', work: 'Working', think: 'Thinking', approval: 'Needs your approval', done: 'Finished', fail: 'Stopped', wait: 'Waiting for the model', walk: 'On the move' }[a.state];
  const canLook = a.kind !== 'default';
  $('#insp').innerHTML = `
    <div class="who"><div class="portrait"><img alt="" src="${portrait(a)}"></div><div><h2>${a.name}</h2><p>${a.role} · ${ROLE_ROOM(a)}</p><div class="badges">${kind}<span class="badge">${a.tier}</span></div></div></div>
    <div class="sec"><h3>Now</h3><div class="now"><span class="chip ${a.state === 'idle' ? 'wait' : a.state}">${stateText}</span><p>${a.task}</p></div></div>
    <div class="sec"><h3>Activity</h3>${a.log.length ? `<ol class="log">${a.log.map(l => `<li><time>${l.t}</time><span>${l.text}</span></li>`).join('')}</ol>` : '<p style="margin:0;color:var(--dim-3);font-size:13px">Nothing yet this session.</p>'}</div>
    ${a.skills.length ? `<div class="sec"><h3>Skills</h3><div class="skills">${a.skills.map(s => `<span class="skill">${s}</span>`).join('')}</div></div>` : ''}
    ${canLook ? `<div class="sec"><h3>Look</h3><div class="look-row"><button class="btn sm" id="reroll"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4.5h-4.5"/></svg>Reroll look</button></div></div>` : ''}
    <div class="actions">
      <button class="btn sm" id="focusBtn"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg>Find in building</button>
      ${a.kind === 'temp' ? '<button class="btn sm" id="keepBtn">Keep as custom</button><button class="btn sm danger" id="delBtn">Dismiss</button>' : a.kind === 'custom' ? '<button class="btn sm danger" id="delBtn">Delete</button>' : `<button class="btn sm" id="offBtn" ${a.pip ? 'disabled title="Pip cannot be switched off"' : ''}>${a.off ? 'Switch on' : 'Switch off'}</button>`}
    </div>`;
  $('#focusBtn').onclick = () => focusAgent(a);
  const rr = $('#reroll'); if (rr) rr.onclick = () => { a.seed = (a.seed || a.id) + '+'; a.look = genLook(a.seed, a.role); a.build(); renderRoster(); renderInspector(); toast(`${a.name} has a new look`); };
  const kb = $('#keepBtn'); if (kb) kb.onclick = () => { a.kind = 'custom'; renderRoster(); renderInspector(); toast(`${a.name} is now a lasting agent`); };
  const db = $('#delBtn'); if (db) db.onclick = () => { leave(a); toast(`${a.name} is heading out`); };
  const ob = $('#offBtn'); if (ob && !a.pip) ob.onclick = () => { a.off = !a.off; a.group.traverse(o => { if (o.isMesh && o.material && 'opacity' in o.material && o.material !== M.outline) { o.material.transparent = a.off; o.material.opacity = a.off ? .35 : 1; } }); a.setState('idle', '', a.off ? 'Switched off. Pip will not give it work.' : 'Waiting for work'); renderInspector(); };
}
function select(a, focus) {
  selected = a; document.querySelectorAll('.row').forEach(el => el.setAttribute('aria-current', String(el.dataset.id === a.id)));
  agents.forEach(x => x.tagEl.classList.toggle('sel', x === a));
  renderInspector();
  if (focus && !floorVisible(a.pos.y)) setFloor(0);
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 2200); }

/* tasks */
let TASKS = [];
function setTasks(list) { TASKS = list; renderTasks(); }
function taskState(id, st) { const t = TASKS.find(x => x.id === id); if (t) { t.st = st; renderTasks(); } }
function renderTasks() {
  const lab = { todo: 'queued', work: 'working', done: 'done', approval: 'needs you', fail: 'denied', stop: 'stopped' };
  $('#tasks').innerHTML = TASKS.map(t => `<li class="task"><span class="dot ${t.st === 'todo' || t.st === 'stop' ? '' : t.st}"></span><b>${t.name}</b>${t.who} · ${lab[t.st]}</li>`).join('');
  const done = TASKS.filter(t => t.st === 'done').length;
  $('#jobMeta').textContent = TASKS.length ? `${done} of ${TASKS.length} tasks done` : 'No job running';
}

/* camera */
let camTween = null;
function flyTo(target, pos, ms = 700) {
  const t0 = controls.target.clone(), p0 = camera.position.clone(), start = performance.now();
  camTween = (now) => { const p = REDUCED ? 1 : Math.min(1, (now - start) / ms), e = easeOut(p); controls.target.lerpVectors(t0, target, e); camera.position.lerpVectors(p0, pos, e); if (p >= 1) camTween = null; };
}
const easeOut = (p) => 1 - Math.pow(1 - p, 4);
function tween(ms, fn) { return new Promise(res => { const s = performance.now(); const step = (n) => { const p = REDUCED ? 1 : Math.min(1, (n - s) / ms); fn(p); p < 1 ? requestAnimationFrame(step) : res(); }; requestAnimationFrame(step); }); }
function focusAgent(a) {
  if (!floorVisible(a.pos.y)) setFloor(0, false);
  const tgt = new THREE.Vector3(a.pos.x, a.pos.y + .9, a.pos.z);
  flyTo(tgt, tgt.clone().add(new THREE.Vector3(4.5, 3.2, 9)));
}
function setFloor(n, fly = true) {
  shownFloors = n === 0 ? 3 : n;
  floors.forEach((g, i) => g.visible = i < shownFloors); roof.visible = n === 0;
  document.querySelectorAll('#floorSeg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.floor === n)));
  if (!fly) return;
  if (n === 0) flyTo(HOME.target.clone(), HOME.pos.clone());
  else { const tgt = new THREE.Vector3(6.4, (n - 1) * H + 1.1, 2.4); flyTo(tgt, tgt.clone().add(new THREE.Vector3(9.5, 8.5, 17))); }
}

/* ---------- the demo job ---------- */
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
let run = 0, decide = null;
const A = (id) => agents.find(a => a.id === id);
function showApproval(a, on) {
  $('#approval').hidden = !on;
  if (on) { $('#apAvatar').innerHTML = `<img alt="" src="${portrait(a)}">`; }
}
function waitDecision() { return new Promise(res => { decide = res; }); }
async function job(fromApproval) {
  const my = ++run; const live = () => my === run;
  const T = [
    { id: 't1', name: 'Specs, laptop A', who: 'Rhea', st: 'todo' }, { id: 't2', name: 'Specs, laptop B', who: 'Rhea', st: 'todo' },
    { id: 't3', name: 'Comparison table', who: 'Wren', st: 'todo' }, { id: 't4', name: 'Save to Documents', who: 'Otto', st: 'todo' },
  ];
  let wren = agents.find(a => a.name === 'Wren' && a.kind === 'temp');
  if (!fromApproval) {
    if (wren) remove(wren); wren = null;
    agents.forEach(a => a.setState('idle', '', 'Waiting for work'));
    setTasks([]);
    A('pip').setState('work', 'routing', `Routing: “${$('#jobTitle').textContent}”`); await sleep(1300); if (!live()) return;
    A('thinker').setState('think', 'planning', 'Turning the request into a plan'); await sleep(2600); if (!live()) return;
    A('thinker').setState('done', 'plan ready', 'Plan delivered: 4 tasks, 1 new agent'); setTasks(T);
    A('pip').setState('work', 'staffing', 'Giving out tasks and asking Bodie for a writer');
    A('bodie').setState('work', 'making a writer', 'Building a temporary writer for task 3'); await sleep(1500); if (!live()) return;
    A('bodie').setState('done', 'made Wren', 'Made Wren, a temporary writer');
    A('rhea').setState('work', 'reading spec pages', 'Finding specs for both laptops'); taskState('t1', 'work'); taskState('t2', 'work');
    const slot = SPARE.find(s => !s.used);
    const arrive = spawn({ id: 'wren', name: 'Wren', role: 'Writer', seed: 'wren-7f3a', task: 'Write a comparison table of both laptops', skills: ['file_ops.read', 'compose'] }, slot);
    await sleep(4200); if (!live()) return;
    taskState('t1', 'done'); taskState('t2', 'done'); A('rhea').setState('done', 'notes sent', 'Sent spec notes to Wren');
    wren = await arrive; if (!live()) return;
    wren.setState('work', 'writing the table', 'Writing a comparison table of both laptops'); taskState('t3', 'work'); await sleep(3400); if (!live()) return;
    wren.setState('done', 'table ready', 'Table finished, waiting to be dismissed'); taskState('t3', 'done');
  } else {
    setTasks(T.map(t => Object.assign({}, t, { st: t.id === 't4' ? 'todo' : 'done' })));
    A('pip').setState('work', 'tracking', 'Tracking job: 3 of 4 tasks done');
    A('thinker').setState('done', 'plan ready', 'Plan delivered: 4 tasks, 1 new agent');
    A('rhea').setState('done', 'notes sent', 'Sent spec notes to Wren');
    A('bodie').setState('idle', '', 'Made Wren, a temporary writer');
    wren = new Agent({ id: 'wren', name: 'Wren', role: 'Writer', kind: 'temp', tier: 'Heavy model', skills: ['file_ops.read', 'compose'], seed: 'wren-7f3a', look: genLook('wren-7f3a', 'Writer'), task: 'Table finished, waiting to be dismissed' });
    const slot = SPARE[0]; wren.slot = slot; slot.used = wren; wren.roomId = 'studio'; placeAt(wren, slot.x, H, slot.z); agents.push(wren);
    wren.setState('done', 'table ready');
  }
  A('otto').setState('approval', 'needs you', 'Save the table to Documents\\laptops.md'); taskState('t4', 'approval');
  showApproval(A('otto'), true); if (!selected || selected.id === 'pip') select(A('otto'));
  renderRoster();
  const ok = await waitDecision(); if (!live()) return;
  showApproval(null, false);
  if (ok) {
    A('otto').setState('work', 'saving the file', 'Writing Documents\\laptops.md'); taskState('t4', 'work'); await sleep(1500); if (!live()) return;
    A('otto').setState('done', 'saved', 'Saved Documents\\laptops.md'); A('otto').hop = .6; taskState('t4', 'done');
  } else { A('otto').setState('fail', 'denied', 'You denied the save. Nothing was written.'); taskState('t4', 'fail'); }
  A('remy').setState('work', 'writing the answer', 'Writing the reply for chat and voice'); await sleep(1600); if (!live()) return;
  A('remy').setState('done', 'answer sent', ok ? 'Sent: “Saved the comparison to Documents.”' : 'Sent: “Okay, I did not save anything.”');
  A('pip').setState('done', 'job closed', 'Closed the job and dismissed Wren');
  if (wren && agents.includes(wren)) { wren.hop = .6; await sleep(700); leave(wren); }
  await sleep(5000); if (!live()) return;
  agents.forEach(a => { if (a.kind !== 'temp' && a.state !== 'walk') a.setState('idle', '', a.off ? a.task : 'Waiting for work'); });
}

/* ---------- events ---------- */
$('#allow').onclick = () => decide && decide(true);
$('#deny').onclick = () => decide && decide(false);
addEventListener('keydown', (e) => { if (e.target.closest('input')) return; if ($('#approval').hidden) return; if (e.key === 'y' || e.key === 'Y') decide && decide(true); if (e.key === 'n' || e.key === 'N') decide && decide(false); });
$('#replay').onclick = () => { showApproval(null, false); job(false); };
$('#composer').onsubmit = (e) => { e.preventDefault(); const v = $('#ask').value.trim(); if (!v) return; $('#jobTitle').textContent = v.length > 60 ? v.slice(0, 58) + '…' : v; $('#ask').value = ''; showApproval(null, false); job(false); };
$('#stopAll').onclick = () => {
  run++; decide = null; showApproval(null, false);
  agents.filter(a => a.kind === 'temp').forEach(a => { a.queue = []; leave(a); });
  agents.filter(a => a.kind !== 'temp').forEach(a => a.setState('idle', '', a.off ? a.task : 'Stopped. Waiting for work'));
  TASKS.forEach(t => { if (t.st !== 'done') t.st = 'stop'; }); renderTasks();
  toast('Stopped everything. Temporary agents are leaving.');
};
$('#homeBtn').onclick = () => setFloor(0);
document.querySelectorAll('#floorSeg button').forEach(b => b.onclick = () => setFloor(+b.dataset.floor));
document.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => toast(`${b.textContent} is a separate tab in the app. This prototype only builds World.`));
$('#skillsBtn').onclick = () => toast('Skills library comes in milestone M4.');
$('#addAgent').onclick = () => { $('#newForm').hidden = false; $('#addAgent').parentElement.hidden = true; $('#newRole').focus(); };
$('#newCancel').onclick = () => { $('#newForm').hidden = true; $('#addAgent').parentElement.hidden = false; };
document.querySelectorAll('.preset').forEach(p => p.onclick = () => { $('#newRole').value = p.textContent; });
$('#newForm').onsubmit = async (e) => {
  e.preventDefault(); const v = $('#newRole').value.trim(); if (!v) { $('#newRole').focus(); return; }
  const slot = SPARE.find(s => !s.used); if (!slot) { toast('Every room is full. The building would add a floor here.'); return; }
  $('#newCancel').click(); $('#newRole').value = '';
  const used = new Set(agents.map(a => a.name)); const name = NAMES.find(n => !used.has(n)) || 'Agent ' + agents.length;
  const role = cap(v.split(' ')[0].length > 12 ? 'Helper' : v.split(' ')[0]);
  A('bodie').setState('work', `making ${name}`, `Building ${name} (${role})`);
  await sleep(1200);
  A('bodie').setState('done', `made ${name}`);
  const a = await spawn({ id: 'a' + Date.now(), name, role, seed: name + ':' + Date.now(), task: v }, slot);
  a.setState('idle', '', v); select(a); toast(`${name} moved into the ${roomById[slot.room].name.replace(' · spare', '')}`);
};

const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const rc = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX - rc.left) / rc.width) * 2 - 1, -((e.clientY - rc.top) / rc.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(agents.map(a => a.group), true).find(h => h.object.visible);
  if (hit && hit.object.userData.agent) select(hit.object.userData.agent);
});

/* ---------- loop ---------- */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h); labelRenderer.setSize(w, h); composer.setSize(w, h); composer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  camera.aspect = w / h;
  camera.fov = w / h < .9 ? 44 : 30; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();
const clock = new THREE.Clock();
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (camTween) camTween(now);
  controls.update();
  const ld = lift.target - lift.y; if (Math.abs(ld) > .001) lift.y += Math.sign(ld) * Math.min(Math.abs(ld), dt * 2.2);
  car.position.y = lift.y;
  agents.forEach(a => a.update(dt, t));
  if (selected) { sel.visible = selected.group.visible; sel.position.set(selected.pos.x, selected.pos.y + .015, selected.pos.z); }
  beacon.material.emissiveIntensity = 1 + (Math.sin(t * 3) > .6 ? 4 : 0);
  const ap = agents.find(a => a.state === 'approval');
  for (const [id, L] of Object.entries(roomLights)) {
    const hot = ap && ap.roomId === id;
    L.light.color.lerp(hot ? col('#ffb347') : L.color, .08);
    L.light.intensity += ((hot ? L.base * 1.5 + Math.sin(t * 4) * 3 : L.base) - L.light.intensity) * .08;
  }
  composer.render();
  labelRenderer.render(scene, camera);
}
renderRoster();
select(A('pip'));
job(true);
requestAnimationFrame(frame);
</script>
</body></html>
